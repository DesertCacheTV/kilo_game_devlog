---
layout: default
---
<article class="post">
  <header class="post-head">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    <h1>{{ page.title }}</h1>
  </header>
  <div class="prose">
    {{ content }}
  </div>
  <p class="back"><a href="{{ "/" | relative_url }}">Back to the trail log</a></p>
</article>
