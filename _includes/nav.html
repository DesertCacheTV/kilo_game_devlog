<nav class="site-nav" aria-label="Site">
  <a href="{{ "/" | relative_url }}"{% if page.url == "/" %} aria-current="page"{% endif %}>Devlog</a>
  {%- for path in site.header_pages -%}
    {%- assign p = site.pages | where: "path", path | first -%}
    {%- if p %}
  <a href="{{ p.url | relative_url }}"{% if page.url == p.url %} aria-current="page"{% endif %}>{{ p.title }}</a>
    {%- endif -%}
  {%- endfor %}
</nav>
