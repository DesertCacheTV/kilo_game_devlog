<section class="board breakout" aria-labelledby="board-title">
  <div class="board-head">
    <h2 id="board-title" class="section-title">How the journey is going</h2>
    <p class="board-date">Updated {{ site.data.progress.updated | date: "%B %-d, %Y" }}</p>
  </div>
  <div class="lanes">
    {%- for lane in site.data.progress.lanes %}
    <div class="lane lane-{{ lane.key }}">
      <h3><span class="sticker">{{ lane.title }}</span></h3>
      <p class="lane-note">{{ lane.note }}</p>
      <ul>
        {%- for item in lane.items %}
        <li>{{ item }}</li>
        {%- endfor %}
      </ul>
    </div>
    {%- endfor %}
  </div>
</section>
