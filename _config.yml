title: "Kilo Man Jar-O Devlog"
tagline: "No matter how small you are, big things are waiting on the horizon."
description: "The devlog for Kilo Man Jar-O (working title), a game about Kilo Man, a 10 cm hero crossing a giant garden toward a pickle jar the size of a mountain. No matter how small you are, big things are waiting on the horizon."
url: "https://DesertCacheTV.github.io"
baseurl: "/kilo_game_devlog"
plugins:
  - jekyll-feed
markdown: kramdown
kramdown:
  input: GFM
permalink: /:year/:month/:day/:title/
header_pages:
  - about.md
  - kilo-man.md
  - how-kilo-is-made.md
  - credits.md
  - videos.html
  - kickstarter.md
feed:
  path: feed.xml
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - publish_devlog.md
  - setup_devlog.ps1
  - _drafts
